spring.application.name=campus-lost-found
server.port=8080

# MySQL DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/campus_lost_found
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# JWT Configuration
# Note: For production, supply a strong 256-bit secret via JWT_SECRET environment variable
jwt.secret=${JWT_SECRET:CampusLostAndFoundSecureJwtSecretKeyForDevelopmentOnly2026!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}

# Admin Initial Provisioning (Idempotent, Config-Guarded)
# Must be explicitly enabled via ADMIN_PROVISION_ENABLED=true for initial setup, then disabled.
admin.provision.enabled=${ADMIN_PROVISION_ENABLED:false}
admin.provision.uid=${ADMIN_PROVISION_UID:ADMIN001}
admin.provision.name=${ADMIN_PROVISION_NAME:Campus Property Administrator}
admin.provision.email=${ADMIN_PROVISION_EMAIL:admin@campus.edu}
admin.provision.password=${ADMIN_PROVISION_PASSWORD:Admin@Campus2026!}
